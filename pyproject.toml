[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-ops"
version = "0.1.0"
description = "Local foundation for an AI-powered IT operations and intelligence platform."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Lucas Nicotari Maffei" }]
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.6",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require the local PostgreSQL service",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
